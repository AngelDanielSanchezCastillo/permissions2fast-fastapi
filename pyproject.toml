[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "permissions2fast-fastapi"
dynamic = ["version"]
description = "Role-based access control (RBAC) and permission management extension for oauth2fast-fastapi"
readme = "README.md"
requires-python = ">=3.14"
license = {file = "LICENSE"}
authors = [
    {name = "Angel Daniel Sanchez Castillo", email = "angeldaniel.sanchezcastillo@gmail.com"}
]
keywords = ["fastapi", "permissions", "rbac", "oauth2", "authorization", "sqlmodel"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Framework :: FastAPI",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    # 0.8.0+ ships UUID v7 primary keys and soft-delete support.
    "oauth2fast-fastapi>=0.8.2",
    # Direct imports of AuthError, APIResponse and ErrorDetail.
    "tools2fast-fastapi>=0.4.0",
    "rbac2fast-core>=0.1.2",
    # 0.6.0+ ships migration helpers for bigint→UUID conversion.
    "pgsqlasync2fast-fastapi>=0.6.2",
    # Alembic ships the shared migration runner/env/registry.
    "alembic>=1.20.0",
]

[dependency-groups]
dev = [
    "black",
    "ruff",
    "mypy>=1.0.0",
    "pre-commit",
    "build",
    "twine",
]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.24.0",
    "python-dotenv>=1.0.0",
    "aiosqlite",
]

[project.urls]
Homepage = "https://github.com/AngelDanielSanchezCastillo/permissions2fast-fastapi"
Repository = "https://github.com/AngelDanielSanchezCastillo/permissions2fast-fastapi"
Issues = "https://github.com/AngelDanielSanchezCastillo/permissions2fast-fastapi/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["permissions2fast_fastapi*"]

# Single source of truth for the version: __version__.py
[tool.setuptools.dynamic]
version = {attr = "permissions2fast_fastapi.__version__.__version__"}

[tool.setuptools.package-data]
"permissions2fast_fastapi" = [
    "seeders/manifest.json",
    "seeders/dev/*.json",
    "seeders/prod/*.json",
    "skills/*.md",
    # Package-owned Alembic chain (alembic-2fast): shipped in the wheel and
    # resolved from the installed release, never a checkout.
    "migrations/**/*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.uv.workspace]
members = [
    "rbac2fast-core",
]
